[project]
name = "aios"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "celery[redis]==5.6.3",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "langgraph==1.2.14",
    "langchain==1.4.3",
    "langchain-anthropic==1.7.5",
    "langchain-voyageai==0.4.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "langfuse==4.16.0",
    "boto3==1.43.108",
    "cronsim==2.7",
    "cryptography==50.0.2",
    "pwdlib[argon2]==0.3.1",
    "email-validator==2.3.0",
    "limits[redis]==5.8.0",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
# torch/torchvision are listed only to pin them to the CPU-only index below.
ingest = ["docling==2.132.0", "torch==2.14.1", "torchvision==0.29.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-randomly==5.0.0", "pytest-split==0.11.0", "ruff==0.16.10"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"

# Docling pulls in torch, and torch from PyPI depends on the CUDA runtime (multi-GB).
# Workers run on CPU, so take torch/torchvision from PyTorch's CPU-only index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-randomly runs the tests in random order; pytest-split shards them (`--splits N --group
# I`), balanced on .test_durations. least_duration picks each shard's tests by id and duration
# alone, so it doesn't depend on the order: docs/testing.md.
addopts = ["--splitting-algorithm=least_duration"]
