[project]
name = "aios"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "celery[redis]==5.6.3",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
    "authlib==1.8.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "pydantic-ai-slim[anthropic,voyageai]==2.52.0",
]

[project.optional-dependencies]
ingest = ["docling==2.132.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"

# Docling pulls in torch, and torch from PyPI depends on the CUDA runtime (multi-GB).
# The worker Dockerfile installs these same pins but takes torch/torchvision from the
# CPU-only index (`uv pip install --torch-backend cpu`) and drops the CUDA packages.

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
