name: Backend tests

# The backend suite split into `shards` groups (pytest-split, balanced on backend/.test_durations),
# each its own job with its own Postgres, Redis and storage, in random order (pytest-randomly).
# Called by ci.yml, and by test-durations.yml to refresh the durations: docs/testing.md.
on:
  workflow_call:
    inputs:
      shards:
        description: How many groups to split the suite into, one job each.
        type: number
        required: true
      store-durations:
        description: Record each test's duration and upload each shard's as an artifact.
        type: boolean
        default: false

jobs:
  # The shards' group numbers, 1 to `shards`, for the matrix.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - id: groups
        run: echo "groups=$(jq -nc '[range(1; ${{ inputs.shards }} + 1)]')" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    name: shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aios" --health-interval 2s --health-retries 30
      # The connection pooler, as in Compose and on AWS: the suite reaches every data store
      # through it (DATA_STORE_POOLER_ADDRESS), in transaction mode.
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DATABASE_URL: postgres://aios:aios@postgres:5432
          AUTH_TYPE: scram-sha-256
          AUTH_DBNAME: aios
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: "0"
          DEFAULT_POOL_SIZE: "5"
          MAX_DB_CONNECTIONS: "10"
          MAX_CLIENT_CONN: "1000"
        ports: ["6432:5432"]
      # The auth endpoints' rate limits (aios.ratelimits), which every test resets.
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      # Stands in for S3, as in Compose: uploaded files (aios.datastores.files).
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health" --health-interval 2s
          --health-retries 30
    # As deployed: the master user (`aios`) only creates the roles; migrations and tests run as
    # the app's role. The master user's DSN also lets tests/test_db_roles.py run.
    env:
      DATABASE_URL: postgresql+psycopg://aios_app:aios_app@localhost:5432/aios
      DATA_STORE_PROVISIONER_URL: postgresql+psycopg://aios_provisioner:aios_provisioner@localhost:5432/aios
      DATABASE_ADMIN_URL: postgresql+psycopg://aios:aios@localhost:5432/aios
      DATA_STORE_FILES_ENDPOINT: http://localhost:9000
      DATA_STORE_FILES_ACCESS_KEY: rustfsadmin
      DATA_STORE_FILES_SECRET_KEY: rustfsadmin
      DATA_STORE_POOLER_ADDRESS: localhost:6432
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run python -m aios.db_roles
      - run: uv run alembic upgrade head
      # Every shard shares the run's seed, so one order reproduces the run: docs/testing.md.
      - run: >-
          uv run pytest --splits ${{ inputs.shards }} --group ${{ matrix.group }}
          --randomly-seed=${{ github.run_id }}
          ${{ inputs.store-durations && format('--store-durations --durations-path=durations-{0}.json', matrix.group) || '' }}
      - uses: actions/upload-artifact@v4
        if: inputs.store-durations
        with:
          name: durations-${{ matrix.group }}
          path: backend/durations-${{ matrix.group }}.json
          retention-days: 7
