name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, formatting and the migration check, once: the backend shards only run tests.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aios" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://aios_app:aios_app@localhost:5432/aios
      DATA_STORE_PROVISIONER_URL: postgresql+psycopg://aios_provisioner:aios_provisioner@localhost:5432/aios
      DATABASE_ADMIN_URL: postgresql+psycopg://aios:aios@localhost:5432/aios
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m aios.db_roles
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  # The backend suite, sharded: backend-tests.yml, docs/testing.md.
  backend:
    uses: ./.github/workflows/backend-tests.yml
    with:
      shards: 4 # the number of backend shards

  # The backend's one required check: passes only if every shard passed.
  backend-gate:
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend.result }}" = success

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # `working-directory` does not apply to actions; the pin lives in frontend/package.json.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # The core loop against the real stack (Compose's `fullstack` profile, on the scripted model):
  # frontend/fullstack/README.md.
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose --profile fullstack up --build --wait --wait-timeout 600 fullstack
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:fullstack
        working-directory: frontend
      - name: Keep the stack's logs
        if: failure()
        run: docker compose --profile fullstack logs --no-color --timestamps > fullstack-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fullstack-report
          path: |
            frontend/playwright-report-fullstack
            frontend/test-results-fullstack
            fullstack-logs.txt
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # Applies the configuration to a mocked AWS and checks it (tests/): no account needed.
      - run: terraform test
