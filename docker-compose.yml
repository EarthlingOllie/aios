# Full stack locally: http://localhost:8080
#   cp .env.example .env   # fill in GitHub OAuth + API keys
#   docker compose up --build
name: aios

x-backend: &backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://aios:aios@db:5432/aios
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Reuses the api image (built once, by the api service) to run migrations.
  migrate:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    image: aios-api:local
    build:
      context: ./backend
      target: api
    # Merges are shallow: `environment` and `depends_on` replace x-backend's, so repeat them.
    environment:
      <<: *backend-env
      SANDBOX_BACKEND: gvisor
      SANDBOX_BROKER_URL: http://broker:8090
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:-dev-broker-token}
      SANDBOX_PROXY_SECRET: ${SANDBOX_PROXY_SECRET:-dev-proxy-secret}
      SANDBOX_PROXY_ADDRESS: egress-proxy:3128
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_started
    ports: ["8000:8000"]

  # Starts run_python's sandboxes as containers on this machine's Docker (it gets the socket,
  # which is root on the host). SANDBOX_DOCKER_RUNTIME defaults to runc, which needs no gVisor
  # but isolates nothing: development only. Set it to runsc where gVisor is installed.
  broker:
    image: aios-broker:local
    build:
      context: ./backend
      target: broker
    environment:
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:-dev-broker-token}
      SANDBOX_PROXY_SECRET: ${SANDBOX_PROXY_SECRET:-dev-proxy-secret}
      SANDBOX_BROKER_ADVERTISE_URL: http://broker:8090
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-runc}
      SANDBOX_IMAGE: aios-sandbox:local
      SANDBOX_PROXY_IMAGE: aios-broker:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  # Only builds the sandbox image (the broker never pulls), then exits.
  sandbox-image:
    image: aios-sandbox:local
    build:
      context: ./backend
      target: sandbox
    command: ["python", "-c", "pass"]
    network_mode: none
    restart: "no"

  worker:
    <<: *backend
    image: aios-worker:local
    build:
      context: ./backend
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
