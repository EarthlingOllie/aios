# Full stack locally: http://localhost:8080
#   cp .env.example .env   # fill in the API keys
#   docker compose up --build
# The full-stack test's stack (profile `fullstack`, no API keys, no outbound calls), on :8090:
#   docker compose --profile fullstack up --build --wait fullstack
#   (see frontend/fullstack/README.md)
name: aios

x-backend: &backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # The app's role (made by `db-roles`), not the master user.
    DATABASE_URL: postgresql+psycopg://aios_app:aios_app@db:5432/aios
    REDIS_URL: redis://redis:6379/0
    # Data stores through the connection pooler (PgBouncer, transaction mode); the platform
    # database stays direct.
    DATA_STORE_POOLER_ADDRESS: pgbouncer:5432
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    # Uploaded files, in RustFS (standing in for S3). Download links are signed for the address
    # the browser reaches it at.
    DATA_STORE_FILES_ENDPOINT: http://rustfs:9000
    DATA_STORE_FILES_PUBLIC_ENDPOINT: http://localhost:9000
    DATA_STORE_FILES_ACCESS_KEY: rustfsadmin
    DATA_STORE_FILES_SECRET_KEY: rustfsadmin
    # Jev, the prompt-injection classifier (`aios.jev`): its fake unless .env names one, hosted
    # (with JEV_API_KEY) or the `jev` service below (`JEV_URL=http://jev:8000`).
    JEV_URL: ${JEV_URL:-fake}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    pgbouncer:
      condition: service_started

# The full-stack test's API and workers (profile `fullstack`): the api image on the scripted model
# (`aios.testing.scenarios`) with fake embeddings, and no keys, so nothing calls a provider (nor
# Langfuse). Ignores .env, so a key there can't reach them.
x-fullstack: &fullstack
  profiles: [fullstack]
  image: aios-api:local
  pull_policy: never
  environment: &fullstack-env
    <<: *backend-env
    PUBLIC_URL: http://localhost:8090
    SCRIPTED_MODELS_ENABLED: "true"
    LLM_MODEL: scripted:core-loop
    EMBEDDING_MODEL: scripted:fake
    JEV_URL: fake
    # Each test registers its own account, from the one address.
    REGISTER_RATE_LIMIT_PER_IP: 1000/hour
    LOGIN_RATE_LIMIT_PER_IP: 1000/hour
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_started
    files-bucket:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    # `aios` is the master user, as on RDS: only `db-roles` (and you, for break-glass access)
    # connect as it.
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 2s
      retries: 30

  # The connection pooler the app reaches data stores through (DATA_STORE_POOLER_ADDRESS), in
  # transaction mode, as on AWS (infra/terraform/pooler.tf). Any database on `db`, as the role
  # the client logs in as: it looks each role's password up as the master user (its auth query,
  # on the platform database). On :6432 from the host.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DATABASE_URL: postgres://aios:aios@db:5432
      AUTH_TYPE: scram-sha-256
      AUTH_DBNAME: aios
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: "0"
      DEFAULT_POOL_SIZE: "5"
      MAX_DB_CONNECTIONS: "10"
      MAX_CLIENT_CONN: "1000"
    ports: ["6432:5432"]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Stands in for S3 (uploaded files, `aios.datastores.files`): single node, S3 API on 9000,
  # which download links send the browser to.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["9000:9000"]
    volumes: [rustfsdata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 2s
      retries: 30

  # Creates the files bucket in RustFS if it's missing (Terraform makes it on AWS).
  files-bucket:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.datastores.files", "create-bucket"]
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # Creates the app's and the provisioner's roles as the master user (`aios.db_roles`), and
  # hands the app's role anything the master user still owns. Reuses the api image (built
  # once, by the api service), as does migrate.
  db-roles:
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.db_roles"]
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://aios:aios@db:5432/aios
      DATABASE_URL: postgresql+psycopg://aios_app:aios_app@db:5432/aios
      DATA_STORE_PROVISIONER_URL: postgresql+psycopg://aios_provisioner:aios_provisioner@db:5432/aios
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      # Not for migrating: the services that wait for migrate rely on it for Redis.
      redis:
        condition: service_healthy
    restart: "no"

  # Brings every ready data store to the store tree's head, and finishes provisioning any left
  # provisioning, as the provisioner (`aios.datastores.provision`), as the deploy does. A store
  # that fails is reported in its log; the rest of the stack starts regardless.
  migrate-stores:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.datastores.provision", "migrate-all"]
    environment: &provisioner-env
      <<: *backend-env
      # The provisioner's role (made by `db-roles`): only this and the maintenance workers below
      # have it.
      DATA_STORE_PROVISIONER_URL: postgresql+psycopg://aios_provisioner:aios_provisioner@db:5432/aios
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    restart: "no"

  # Celery's maintenance workers (aios.worker), the only services (with the deploy's one-off
  # tasks above) that hold the provisioner's credentials. They need no Docling, so they reuse the
  # api image.
  # Urgent maintenance: applying approved changes and restores, which people are waiting on. It
  # takes nothing else, so never waits behind migrations or sweeps.
  urgent-worker:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command:
      ["celery", "-A", "aios.worker", "worker", "-Q", "urgent", "--loglevel=INFO", "--concurrency=1"]
    environment: *provisioner-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started

  # Routine maintenance: creating, migrating, measuring and deleting data stores, purging,
  # expiry, retention, the event sweep and reconciliation. It runs the one beat (-B), which only
  # enqueues: the queue metrics every QUEUE_METRICS_INTERVAL_SECONDS, and the sweeps. It also
  # drains the retired `provisioning` queue (aios.worker.RETIRED_QUEUES).
  routine-worker:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command:
      ["celery", "-A", "aios.worker", "worker", "-Q", "routine,provisioning", "--loglevel=INFO",
       "--concurrency=1", "-B", "--schedule=/tmp/celerybeat-schedule"]
    environment: *provisioner-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started

  api:
    <<: *backend
    image: aios-api:local
    build:
      context: ./backend
      target: api
    # The merge above is shallow, so the shared environment is merged in again here.
    environment:
      <<: *backend-env
      # Behind `web`'s nginx, which appends the client's address to X-Forwarded-For.
      TRUSTED_PROXY_COUNT: 1
      SANDBOX_BACKEND: dev
      SANDBOX_DEV_URL: http://sandbox:8080
      SANDBOX_DEV_TOKEN: dev-sandbox-token
      # The sign-in page's "sign in as" picker (any user, no password): development only.
      DEV_LOGIN_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      files-bucket:
        condition: service_completed_successfully
      sandbox:
        condition: service_started
    ports: ["8000:8000"]

  # Document ingest (the `ingest` queue), with Docling.
  ingest-worker:
    <<: *backend
    image: aios-worker:local
    build:
      context: ./backend
      target: worker
    command: ["celery", "-A", "aios.worker", "worker", "-Q", "ingest", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      files-bucket:
        condition: service_completed_successfully

  # The run service (aios.run_service): mentioned agents' turns, the handoff before every mention,
  # and the schedules. On the api image; the web servers run no agent work.
  run-service:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.run_service"]
    # Its agents run run_python, so it uses the same sandbox as the api did.
    environment:
      <<: *backend-env
      SANDBOX_BACKEND: dev
      SANDBOX_DEV_URL: http://sandbox:8080
      SANDBOX_DEV_TOKEN: dev-sandbox-token
    # A termination signal lets its items finish for up to RUN_SERVICE_SHUTDOWN_GRACE_SECONDS
    # (25) before it hands the rest back to the queue.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      sandbox:
        condition: service_started

  # The run_python sandbox for local development (SANDBOX_BACKEND=dev): one long-lived runner
  # shared by every agent run, with no network restrictions (it can reach db and redis).
  # Unisolated, so never expose it beyond localhost. Port 8081 is for an API run outside
  # Docker (SANDBOX_DEV_URL's default).
  sandbox:
    build:
      context: ./backend
      target: sandbox
    read_only: true
    # Docker mounts tmpfs noexec,nosuid,nodev unless told otherwise; Fargate's task volumes
    # allow exec, so code that writes and runs (or loads) files there works the same here.
    tmpfs: ["/tmp:exec", "/work:exec"]
    # The same capabilities as on Fargate (infra/terraform/sandbox.tf).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    environment:
      SANDBOX_TOKEN: dev-sandbox-token
      # About a year: the runner otherwise exits when idle (and restarts with an empty /work).
      SANDBOX_IDLE_SECONDS: "31536000"
      SANDBOX_MAX_SECONDS: "31536000"
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

  # Jev for local development (profile `jev`), as laya-php runs it: laya-serve, which speaks
  # Jev's `POST /v1/systemone`, built from upstream's Dockerfile pinned to a known commit (CPU
  # torch). Its first request downloads its weights (~1 GB) into the volume. Point the backend at
  # it with JEV_URL=http://jev:8000 in .env:
  #   docker compose --profile jev up -d --wait jev
  jev:
    profiles: [jev]
    build:
      context: https://github.com/NandhaKishorM/laya.git#8c42cf35127448ad4b2dfc011ee087a9f134488e
    command: ["laya-serve"]
    environment:
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "0"
      LAYA_API_KEY: ${JEV_API_KEY:-}
    volumes:
      - jev-models:/home/laya/.cache/huggingface
    init: true
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      start_period: 10m
      start_interval: 2s

  web:
    build: ./frontend
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    ports: ["8080:80"]

  # ---------- The full-stack test's stack: `docker compose --profile fullstack up --wait fullstack`
  # Everything a chat turn and an approval need, with the shared db, redis, rustfs, roles,
  # bucket, migrations (platform and stores) and maintenance workers above. The test drives it
  # through fullstack-web, on :8090 (frontend/playwright.fullstack.config.ts).
  fullstack-api:
    <<: *fullstack
    build:
      context: ./backend
      target: api
    environment:
      <<: *fullstack-env
      TRUSTED_PROXY_COUNT: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 2s
      retries: 60

  # The ingest queue. On the api image, which has no Docling: the core loop ingests no
  # documents.
  fullstack-worker:
    <<: *fullstack
    command: ["celery", "-A", "aios.worker", "worker", "-Q", "ingest", "--loglevel=INFO", "--concurrency=1"]

  fullstack-run-service:
    <<: *fullstack
    command: ["python", "-m", "aios.run_service"]
    stop_grace_period: 30s

  fullstack-web:
    profiles: [fullstack]
    image: aios-fullstack-web:local
    build: ./frontend
    volumes:
      - ./frontend/nginx.fullstack.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fullstack-api:
        condition: service_healthy
    ports: ["8090:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost/"]
      interval: 2s
      retries: 30

  # The whole stack, up and ready: what `up --wait fullstack` waits for. Does nothing itself.
  fullstack:
    profiles: [fullstack]
    image: aios-api:local
    pull_policy: never
    command: ["sleep", "infinity"]
    init: true
    depends_on:
      fullstack-web:
        condition: service_healthy
      fullstack-worker:
        condition: service_started
      fullstack-run-service:
        condition: service_started
      urgent-worker:
        condition: service_started
      routine-worker:
        condition: service_started
      migrate-stores:
        condition: service_completed_successfully

  # Claude Code on the stack's network, for debugging with full context (README, "Debug with
  # Claude Code"). Opt-in: docker compose --profile debug run --rm claude
  claude:
    <<: *backend
    profiles: [debug]
    build:
      context: ./infra/claude
      args:
        UID: ${CLAUDE_UID:-1000}
    environment:
      <<: *backend-env
      SANDBOX_BACKEND: dev
      SANDBOX_DEV_URL: http://sandbox:8080
      SANDBOX_DEV_TOKEN: dev-sandbox-token
      DOCKER_HOST: tcp://docker-proxy:2375
      COMPOSE_PROJECT_NAME: aios
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    volumes:
      - .:/workspace
      - claude-home:/home/dev/.claude
      - claude-venv:/home/dev/.venv
      - claude-cache:/home/dev/.cache
      - claude-node-modules:/workspace/frontend/node_modules
    stdin_open: true
    tty: true

  # Read-only Docker API for the claude service: logs, ps and inspect, but no exec, start/stop,
  # or anything else that writes (POST=0). Only reachable on the compose network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [debug]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      POST: 0
      # Listen on IPv4 only, so it also starts where IPv6 is disabled.
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  jev-models:
  pgdata:
  rustfsdata:
  claude-home:
  claude-venv:
  claude-cache:
  claude-node-modules:
