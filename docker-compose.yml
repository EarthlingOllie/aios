# Full stack locally: http://localhost:8080
#   cp .env.example .env   # fill in GitHub OAuth + API keys
#   docker compose up --build
name: aios

x-backend: &backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # The app's role (made by `db-roles`), not the master user.
    DATABASE_URL: postgresql+psycopg://aios_app:aios_app@db:5432/aios
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    # Uploaded files, in RustFS (standing in for S3). Download links are signed for the address
    # the browser reaches it at.
    DATA_STORE_FILES_ENDPOINT: http://rustfs:9000
    DATA_STORE_FILES_PUBLIC_ENDPOINT: http://localhost:9000
    AWS_ACCESS_KEY_ID: rustfsadmin
    AWS_SECRET_ACCESS_KEY: rustfsadmin
    AWS_DEFAULT_REGION: us-east-1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    # `aios` is the master user, as on RDS: only `db-roles` (and you, for break-glass access)
    # connect as it.
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Stands in for S3 (uploaded files, `aios.datastores.files`): single node, S3 API on 9000,
  # which download links send the browser to.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["9000:9000"]
    volumes: [rustfsdata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 2s
      retries: 30

  # Creates the files bucket in RustFS if it's missing (Terraform makes it on AWS).
  files-bucket:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.datastores.files", "create-bucket"]
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # Creates the app's and the provisioner's roles as the master user (`aios.db_roles`), and
  # hands the app's role anything the master user still owns. Reuses the api image (built
  # once, by the api service), as does migrate.
  db-roles:
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.db_roles"]
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://aios:aios@db:5432/aios
      DATABASE_URL: postgresql+psycopg://aios_app:aios_app@db:5432/aios
      DATA_STORE_PROVISIONER_URL: postgresql+psycopg://aios_provisioner:aios_provisioner@db:5432/aios
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      # Not for migrating: the services that wait for migrate rely on it for Redis.
      redis:
        condition: service_healthy
    restart: "no"

  # Brings every ready data store to the store tree's head, and finishes provisioning any left
  # provisioning, as the provisioner (`aios.datastores.provision`), as the deploy does. A store
  # that fails is reported in its log; the rest of the stack starts regardless.
  migrate-stores:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["python", "-m", "aios.datastores.provision", "migrate-all"]
    environment: &provisioner-env
      <<: *backend-env
      # The provisioner's role (made by `db-roles`): only these two services have it.
      DATA_STORE_PROVISIONER_URL: postgresql+psycopg://aios_provisioner:aios_provisioner@db:5432/aios
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Creates data stores (the provisioning queue, see aios.worker) as users sign up, and (-B)
  # retries any that gave up every few minutes. It needs no Docling, so this reuses the api image.
  provisioning-worker:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command:
      ["celery", "-A", "aios.worker", "worker", "-Q", "provisioning", "--loglevel=INFO", "--concurrency=1",
       "-B", "--schedule=/tmp/celerybeat-schedule"]
    environment: *provisioner-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    image: aios-api:local
    build:
      context: ./backend
      target: api
    # The merge above is shallow, so the shared environment is merged in again here.
    environment:
      <<: *backend-env
      SANDBOX_BACKEND: dev
      SANDBOX_DEV_URL: http://sandbox:8080
      SANDBOX_DEV_TOKEN: dev-sandbox-token
    depends_on:
      migrate:
        condition: service_completed_successfully
      files-bucket:
        condition: service_completed_successfully
      sandbox:
        condition: service_started
    ports: ["8000:8000"]

  worker:
    <<: *backend
    image: aios-worker:local
    build:
      context: ./backend
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      files-bucket:
        condition: service_completed_successfully

  # Workflow runs, on their own queue so ingests don't wait behind them (see aios.worker).
  # They need no Docling, so this reuses the api image.
  workflow-worker:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command:
      ["celery", "-A", "aios.worker", "worker", "-Q", "workflows", "--loglevel=INFO", "--concurrency=2"]
    # Its agent nodes run run_python too, so it uses the same sandbox as the api.
    environment:
      <<: *backend-env
      SANDBOX_BACKEND: dev
      SANDBOX_DEV_URL: http://sandbox:8080
      SANDBOX_DEV_TOKEN: dev-sandbox-token
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox:
        condition: service_started

  # The run_python sandbox for local development (SANDBOX_BACKEND=dev): one long-lived runner
  # shared by every agent run, with no network restrictions (it can reach db and redis).
  # Unisolated, so never expose it beyond localhost. Port 8081 is for an API run outside
  # Docker (SANDBOX_DEV_URL's default).
  sandbox:
    build:
      context: ./backend
      target: sandbox
    read_only: true
    # Docker mounts tmpfs noexec,nosuid,nodev unless told otherwise; Fargate's task volumes
    # allow exec, so code that writes and runs (or loads) files there works the same here.
    tmpfs: ["/tmp:exec", "/work:exec"]
    # The same capabilities as on Fargate (infra/terraform/sandbox.tf).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    environment:
      SANDBOX_TOKEN: dev-sandbox-token
      # About a year: the runner otherwise exits when idle (and restarts with an empty /work).
      SANDBOX_IDLE_SECONDS: "31536000"
      SANDBOX_MAX_SECONDS: "31536000"
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

  web:
    build: ./frontend
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  rustfsdata:
