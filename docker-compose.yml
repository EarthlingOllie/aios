# Full stack locally: http://localhost:8080
#   cp .env.example .env   # fill in GitHub OAuth + API keys
#   docker compose up --build
name: aios

x-backend: &backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://aios:aios@db:5432/aios
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Reuses the api image (built once, by the api service) to run migrations.
  migrate:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    image: aios-api:local
    build:
      context: ./backend
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["8000:8000"]

  worker:
    <<: *backend
    image: aios-worker:local
    build:
      context: ./backend
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Workflow runs, on their own queue so ingests don't wait behind them (see aios.worker).
  # They need no Docling, so this reuses the api image.
  workflow-worker:
    <<: *backend
    image: aios-api:local
    pull_policy: never
    command:
      ["celery", "-A", "aios.worker", "worker", "-Q", "workflows", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
