# Compose's `fullstack` profile (the full-stack test): nginx.compose.conf, to its own API.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location ~ ^/api(/|$) {
        proxy_pass http://fullstack-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live updates are server-sent events (aios.api.streams): never buffered, and a
        # read timeout well above the stream heartbeat (STREAM_HEARTBEAT_SECONDS, 15s).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
