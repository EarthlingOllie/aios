# Static SPA. In AWS the ALB routes /api to the API service; docker-compose mounts
# nginx.compose.conf instead, which proxies it itself.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
